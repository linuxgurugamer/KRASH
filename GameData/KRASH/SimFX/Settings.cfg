// KRASH simulation visuals (SimFX) settings. Read once per flight scene.
//
// Except for 'enabled' and 'debugLogging', these are DEFAULTS: every save has its own copy under
// Settings > Difficulty Options > KRASH. New saves (and options a save has never stored)
// start from the values below.

// Master switch for the simulation visuals (KRASH itself is not affected).
enabled = true

// Extra [KRASH SimFX] [debug] lines in KSP.log.
debugLogging = false

// ---- Simulation profile -----------------------------------------------------------------------

// TUFX profile (TUFX_PROFILE { name = ... }) shown while a KRASH simulation runs.
simProfile = KRASH-SimFX

// Also use the simulation look in map view / IVA (otherwise they keep their TUFX profiles).
applyInMap = false
applyInIVA = false

// Simulated frame rate of the 3D image (0 = off). The game itself keeps running at full speed:
// only the scene image is held between updates, so the UI, scanlines and refresh band stay fluid.
frameRateLimit = 20

// Motion blur of the simulated camera: each simulated frame averages the real frames inside its
// exposure. Needs frameRateLimit > 0. Scanlines and refresh band are drawn on top and stay sharp.
motionBlur = true
// motionBlurShutter: exposure per simulated frame in degrees, 0 .. 360
// (180 = half the frame time, like a film camera; 360 = all of it). Lower frame rate = longer trails.
motionBlurShutter = 180

// Percentage of the screen resolution the 3D view is shown at, 25 .. 100 (100 = off).
// Blocky pixels; the UI stays sharp. Visual only: the scene is still rendered at full resolution.
resolutionPercent = 50

// ---- Screen effects (drawn after all post-processing) -----------------------------------------

// CRT scanlines: dark gaps between lines, with a soft beam profile.
scanlines = true
// scanlineStrength: darkness of the gaps, 0 .. 100 (%)
scanlineStrength = 40
// scanlineSize: rendered rows per scanline, 1 .. 8 (1 is usually too fine to see on high-resolution screens)
scanlineSize = 2

// Rolling refresh band: what a camera sees when it films a CRT out of sync. A sharp edge
// (bright above, dark below) with a soft fade behind it, slowly rolling down the screen.
refreshBand = true
// refreshBandStrength: 0 .. 100 (%)
refreshBandStrength = 30
