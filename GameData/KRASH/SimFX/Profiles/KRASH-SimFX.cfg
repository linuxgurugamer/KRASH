// ============================================================================
//  KRASH-SimFX  -  TUFX profile for KRASH simulations (simulation visuals)
//  Look: "holographic training display" - cyan monochrome, raised blacks,
//  signal noise, chromatic aberration and a monitor-like frame.
//
//  Location: GameData/KRASH/SimFX/Profiles/KRASH-SimFX.cfg
//  Requires: TUFX (+ Module Manager). Turn off wireframes in KRASH's options.
//  Used by default; pick another profile in Difficulty Options > KRASH.
//
//  LDR mode (LowDefinitionRange) on purpose: it works with HDR on or off
//  and does not conflict with Scatterer/EVE.
// ============================================================================

TUFX_PROFILE
{
	name = KRASH-SimFX

	// ------------------------------------------------------------------
	// Colour: the heart of the effect. The channel mixer collapses the image
	// to near-luminance, pulled towards cyan. Red is weak; blue and green
	// carry the image.
	// ------------------------------------------------------------------
	EFFECT
	{
		name = ColorGrading
		GradingMode = LowDefinitionRange

		Temperature = -25
		Tint = -5
		ColorFilter = 0.75,1,1,1
		HueShift = 0
		Saturation = -30
		Brightness = 5
		Contrast = 18

		// Mixer (values in %, default = 100 on the diagonal, 0 elsewhere)
		MixerRedOutRedIn = 35
		MixerRedOutGreenIn = 45
		MixerRedOutBlueIn = 5

		MixerGreenOutRedIn = 25
		MixerGreenOutGreenIn = 70
		MixerGreenOutBlueIn = 15

		MixerBlueOutRedIn = 25
		MixerBlueOutGreenIn = 55
		MixerBlueOutBlueIn = 40

		// Lift raises the blacks to a dark teal: space is never pure black,
		// which sells the idea of a "screen" rather than a window.
		// (the 4th value, w, raises the level; xyz only tint the shadows)
		Lift = 0,0.02,0.035,0.05
		Gamma = 0,0,0,0
		Gain = 0,0,0,0
	}

	// ------------------------------------------------------------------
	// Cyan glow on engines, the sun and bright surfaces: the screen's "phosphor".
	// ------------------------------------------------------------------
	EFFECT
	{
		name = Bloom
		Intensity = 2.5
		Threshold = 0.9
		SoftKnee = 0.5
		Clamp = 65472
		Diffusion = 7
		AnamorphicRatio = 0.15
		Color = 0.6,0.95,1,1
		FastMode = false
	}

	// ------------------------------------------------------------------
	// Signal noise. Monochrome, so it does not bring colour back.
	// ------------------------------------------------------------------
	EFFECT
	{
		name = Grain
		Colored = false
		Intensity = 0.45
		Size = 1.4
		LumContrib = 0.6
	}

	// ------------------------------------------------------------------
	// RGB fringing at the edges: gives away that it is a projected image.
	// ------------------------------------------------------------------
	EFFECT
	{
		name = ChromaticAberration
		Intensity = 0.35
		FastMode = false
	}

	// ------------------------------------------------------------------
	// Slight visor/CRT curvature. Scale > 1 hides the stretched edges.
	// ------------------------------------------------------------------
	EFFECT
	{
		name = LensDistortion
		Intensity = 15
		IntensityX = 1
		IntensityY = 1
		CenterX = 0
		CenterY = 0
		Scale = 1.03
	}

	// ------------------------------------------------------------------
	// Dark teal frame that closes the picture like a monitor.
	// ------------------------------------------------------------------
	EFFECT
	{
		name = Vignette
		Mode = Classic
		Color = 0,0.05,0.08,1
		Center = 0.5,0.5
		Intensity = 0.42
		Smoothness = 0.35
		Roundness = 1
		Rounded = false
	}
}
