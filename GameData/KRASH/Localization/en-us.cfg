        #KRASH_SimFX_Settings_simProfile = TUFX profile
        #KRASH_SimFX_Settings_simProfile_tooltip = TUFX profile shown while a simulation runs. 'Default (...)' uses simProfile from GameData/KRASH/SimFX/Settings.cfg, whose name is shown in the parentheses. Hidden when TUFX is not installed.
        #KRASH_SimFX_Settings_applyInMap = Use in map view
        #KRASH_SimFX_Settings_applyInMap_tooltip = Also show the simulation look in map view.
        #KRASH_SimFX_Settings_applyInIVA = Use in IVA
        #KRASH_SimFX_Settings_applyInIVA_tooltip = Also show the simulation look in IVA.
        #KRASH_SimFX_Settings_frameRate = Simulated frame rate (0 = off)
        #KRASH_SimFX_Settings_frameRate_tooltip = The 3D image only updates this many times per second. The game, UI, scanlines and refresh band keep running at full frame rate.
        #KRASH_SimFX_Settings_motionBlur = Motion blur
        #KRASH_SimFX_Settings_motionBlur_tooltip = Blur of the simulated camera: each simulated frame averages the real frames inside its exposure. Needs a simulated frame rate. Scanlines and refresh band stay sharp.
        #KRASH_SimFX_Settings_motionBlurShutter = Motion blur shutter (°)
        #KRASH_SimFX_Settings_motionBlurShutter_tooltip = Exposure per simulated frame: 180° = half the frame time (film camera), 360° = all of it. Lower simulated frame rate = longer trails.
        #KRASH_SimFX_Settings_resolution = Render resolution (%)
        #KRASH_SimFX_Settings_resolution_tooltip = Shows the 3D view at a fraction of the screen resolution (blocky pixels). 100 = off. The UI stays sharp.
        #KRASH_SimFX_Effects_Title = Simulation screen effects
        #KRASH_SimFX_Effects_scanlines = Scanlines
        #KRASH_SimFX_Effects_scanlines_tooltip = Dark gaps between the lines of the image, like a CRT monitor.
        #KRASH_SimFX_Effects_scanlineStrength = Scanline strength (%)
        #KRASH_SimFX_Effects_scanlineSize = Rows per scanline
        #KRASH_SimFX_Effects_scanlineSize_tooltip = Rendered rows per scanline. 2 is a good default; 1 (one line per blocky pixel row) is usually too fine to see on high-resolution screens.
        #KRASH_SimFX_Effects_refreshBand = Rolling refresh band
        #KRASH_SimFX_Effects_refreshBand_tooltip = What a camera sees when it films a CRT out of sync: a sharp edge, bright above and dark below, with a soft fade, slowly rolling down.
        #KRASH_SimFX_Effects_refreshBandStrength = Refresh band strength (%)
        #KRASH_SimFX_Standalone_Title = KRASH-SimFX is still installed
        #KRASH_SimFX_Standalone_Message = The simulation visuals of the separate KRASH-SimFX mod are now part of KRASH. Please delete the folder GameData/KRASH-SimFX.\n\nUntil then, KRASH keeps its built-in simulation visuals turned off, and KRASH-SimFX forgets its per-save options every time a save is loaded.
