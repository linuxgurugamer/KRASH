        #KRASH_SimFX_Settings_Title = Simulation visuals
        #KRASH_SimFX_Settings_useInSimulations = Use simulation visuals
        #KRASH_SimFX_Settings_useInSimulations_tooltip = Show simulations with the simulation look (TUFX profile and screen effects). The same switch is in the simulation launch window, next to the Start simulation button.
